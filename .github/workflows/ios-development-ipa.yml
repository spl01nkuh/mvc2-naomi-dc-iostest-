name: iOS native gameplay IPA
on:
  push:
    branches: [ios-device-build-intel]
    paths:
      - ports/port/ios/**
      - ports/port/**
      - include/**
      - src/**
      - .github/workflows/ios-development-ipa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test native game assets and iOS presentation and controls
        run: |
          cmake -S ports/tests -B build/ipa-validation -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ipa-validation --parallel 4 --target \
            test_native64_model test_native64_render test_native64_match_textures \
            test_native64_attract_effects test_native64_attract_opening \
            test_native64_widescreen test_native64_aica test_native64_front_text test_ios_viewport
          ctest --test-dir build/ipa-validation --output-on-failure \
            -R '^(native64_(model|render|match_textures|front_text|attract_effects|attract_opening|widescreen|aica)|ios_viewport)$'
          clang -I ports/port/include -c ports/port/ios/input/input.c -o build/ipa-validation/input.o
          swiftc -swift-version 5 -D MVC2_TEST_NATIVE_BRIDGE -I ports/port/ios -I ports/port/include \
            -import-objc-header ports/port/ios/NativeBridge.h ports/port/ios/AppSettings.swift \
            ports/port/ios/InputState.swift ports/port/ios/NativeFrames.swift \
            ports/tests/test_ios_settings.swift build/ipa-validation/input.o -o build/ipa-validation/test-ios-settings
          build/ipa-validation/test-ios-settings
          swift ports/tests/test_metal_presentation.swift ports/port/ios/display/Presentation.metal
      - name: Build device native gameplay IPA
        env:
          MVC2_DEV_BUILD_NUMBER: ${{ github.run_number }}
        run: bash ports/port/ios/build-development-ipa.sh device
      - name: Verify IPA structure and native components
        run: |
          python3 ports/port/ios/verify-development-ipa.py build/ios-development-device/MVC2-Gameplay-unsigned.ipa
          xcrun vtool -show-build build/ios-development-device/Release-iphoneos/MVC2Development.app/MVC2Development
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MVC2-Gameplay-unsigned
          path: |
            build/ios-development-device/MVC2-Gameplay-unsigned.ipa
            build/ios-development-device/SHA256.txt
          if-no-files-found: error
