name: iOS native gameplay IPA
on:
  push:
    branches: [native-ios-gameplay]
    paths:
      - ports/port/ios/**
      - ports/port/**
      - include/**
      - src/**
      - .github/workflows/ios-development-ipa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test native character selection assets, attract mode and presentation
        run: |
          cmake -S ports/tests -B build/ipa-validation -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ipa-validation --target test_native64_render test_native64_attract_effects test_native64_widescreen --parallel 4
          ctest --test-dir build/ipa-validation --output-on-failure -R '^native64_(render|attract_effects|widescreen)$'
          swift ports/tests/test_metal_presentation.swift ports/port/ios/display/Presentation.metal
      - name: Build device native gameplay IPA
        env:
          MVC2_DEV_BUILD_NUMBER: ${{ github.run_number }}
        run: bash ports/port/ios/build-development-ipa.sh device
      - name: Build simulator app
        run: bash ports/port/ios/build-development-ipa.sh simulator
      - name: Verify IPA structure and native components
        run: |
          python3 ports/port/ios/verify-development-ipa.py build/ios-development-device/MVC2-Gameplay-unsigned.ipa
          xcrun vtool -show-build build/ios-development-device/Release-iphoneos/MVC2Development.app/MVC2Development
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MVC2-Gameplay-unsigned
          path: |
            build/ios-development-device/MVC2-Gameplay-unsigned.ipa
            build/ios-development-device/SHA256.txt
          if-no-files-found: error
      - name: Launch simulator gameplay host
        timeout-minutes: 12
        run: |
          device_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" build/ios-development-simulator/Release-iphonesimulator/MVC2Development.app
          xcrun simctl launch "$device_id" com.spl01nkuh.mvc2.native.dev --mvc2-widescreen-preview=on
          sleep 3
          xcrun simctl io "$device_id" screenshot build/ios-development-simulator/launch.png
          for style in dpad stick; do
            xcrun simctl terminate "$device_id" com.spl01nkuh.mvc2.native.dev
            xcrun simctl launch "$device_id" com.spl01nkuh.mvc2.native.dev "--mvc2-controls-preview=$style" --mvc2-directions-preview=transparent --mvc2-widescreen-preview=on
            sleep 2
            xcrun simctl io "$device_id" screenshot "build/ios-development-simulator/controls-$style.png"
          done
          xcrun simctl terminate "$device_id" com.spl01nkuh.mvc2.native.dev
          container="$(xcrun simctl get_app_container "$device_id" com.spl01nkuh.mvc2.native.dev data)"
          mkdir -p "$container/Documents/MVC2"
          printf '%s\n' 'Simulated interruption during game frame 800' > "$container/Documents/MVC2/.active-session.txt"
          xcrun simctl launch "$device_id" com.spl01nkuh.mvc2.native.dev
          sleep 3
          test ! -e "$container/Documents/MVC2/.active-session.txt"
          grep -Fx 'Simulated interruption during game frame 800' "$container/Documents/MVC2/LastInterruptedSession.txt"
          xcrun simctl io "$device_id" screenshot build/ios-development-simulator/recovery.png
          xcrun simctl terminate "$device_id" com.spl01nkuh.mvc2.native.dev
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MVC2-Gameplay-simulator-launch
          path: |
            build/ios-development-simulator/launch.png
            build/ios-development-simulator/controls-*.png
            build/ios-development-simulator/recovery.png
            build/ipa-validation/widescreen-fixtures/*.ppm
          if-no-files-found: error
