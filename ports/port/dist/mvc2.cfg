# mvc2.cfg: one "key = value" a line; # starts a note. The game also keeps its own settings here.
#
# The game's data, relative to this folder or a full path:
# arcade = roms/mvsc2
# dc = disc
#
# Which to start when both are found: arcade or dc
# mode = arcade
#
# Scaling: aspect, integer or stretch. Full screen: yes or no
# scale = aspect
# fullscreen = no
#
# gpu, or soft: the CPU, at 640 by 480
# renderer = gpu
#
# soft's picture: exact, fast, half, fast+half, nofog or nosort
# render = exact
#
# The GPU's: drawn at auto (the window's size) or 1 to 12 times 640 by 480; aa 1 to 4 draws auto that
# many times larger again, filtered down. Sprites: sharp, pixel (the nearest texel) or arcade
# resolution = auto
# aa = 1
# sprites = sharp
#
# Every character, colour and stage; saves keep only what you really unlocked
# unlock = all
